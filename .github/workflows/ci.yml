name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # `npm run format:check` is deliberately absent: the repo predates any
      # formatting pass and 83 files would fail it. Run `npm run format` on the
      # whole tree in its own commit, then add the step here.

      - name: Tests
        run: npm run test:run

      - name: Build
        run: npm run build
        env:
          # The build only needs these to exist — it never connects. Real
          # values live in the Vercel project settings.
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
          JWT_SECRET: ci-placeholder-secret-not-used-at-runtime
          NEXT_PUBLIC_APP_URL: https://www.gadscale.com
